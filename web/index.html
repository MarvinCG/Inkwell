<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<meta name="description" content="Inkwell — handwriting and text notes that sync across your devices">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>Inkwell Notes</title>
</head>
<body>
<div id="app" class="app">

  <!-- ───────── Sidebar / drawer ───────── -->
  <aside id="sidebar" class="sidebar" aria-label="Folders">
    <div class="sidebar-head">
      <img src="icons/icon.svg" alt="" class="logo" width="28" height="28">
      <span class="brand">Inkwell</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <button id="btnSettings" class="nav-item" type="button"><span class="ico" data-icon="settings"></span><span>Settings</span></button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <!-- ───────── Notes list ───────── -->
  <main id="listView" class="list-view">
    <header class="appbar list-bar">
      <button id="btnMenu" class="icon-btn only-narrow" type="button" aria-label="Folders" data-icon="menu"></button>
      <h1 id="listTitle" class="list-title">All notes</h1>
      <div class="search">
        <span class="ico" data-icon="search"></span>
        <input id="search" type="search" placeholder="Search notes" autocomplete="off" enterkeyhint="search">
      </div>
      <button id="btnSync" class="icon-btn sync-btn" type="button" aria-label="Sync status" data-icon="cloud"></button>
      <button id="btnSort" class="icon-btn" type="button" aria-label="Sort" data-icon="sort"></button>
      <button id="btnView" class="icon-btn" type="button" aria-label="Grid or list" data-icon="grid"></button>
    </header>
    <div id="trashBar" class="info-bar" hidden>
      <span>Notes in the trash are deleted for good after 30 days.</span>
      <button id="btnEmptyTrash" class="text-btn danger" type="button">Empty trash</button>
    </div>
    <div id="notes" class="notes grid" role="list"></div>
    <div id="empty" class="empty" hidden></div>
    <button id="fab" class="fab" type="button" aria-label="New note" data-icon="plus"></button>
  </main>

  <!-- ───────── Editor ───────── -->
  <section id="editorView" class="editor-view" hidden>
    <header class="appbar editor-bar">
      <button id="btnBack" class="icon-btn" type="button" aria-label="Back to notes" data-icon="back"></button>
      <div class="seg" role="group" aria-label="Input mode">
        <button id="modeText" class="seg-btn active" type="button" aria-label="Keyboard mode" data-icon="type"></button>
        <button id="modeDraw" class="seg-btn" type="button" aria-label="Handwriting mode" data-icon="pen"></button>
      </div>
      <span class="spacer"></span>
      <span id="saveState" class="save-state" aria-live="polite"></span>
      <button id="btnUndo" class="icon-btn" type="button" aria-label="Undo" data-icon="undo"></button>
      <button id="btnRedo" class="icon-btn" type="button" aria-label="Redo" data-icon="redo"></button>
      <button id="btnFull" class="icon-btn" type="button" aria-label="Full screen" title="Full screen" data-icon="expand"></button>
      <button id="btnFav" class="icon-btn" type="button" aria-label="Favorite" data-icon="star"></button>
      <button id="btnNoteMenu" class="icon-btn" type="button" aria-label="More" data-icon="more"></button>
    </header>

    <div id="textToolbar" class="toolbar" role="toolbar" aria-label="Formatting">
      <button class="tb" data-cmd="bold" aria-label="Bold" data-icon="bold"></button>
      <button class="tb" data-cmd="italic" aria-label="Italic" data-icon="italic"></button>
      <button class="tb" data-cmd="underline" aria-label="Underline" data-icon="underline"></button>
      <button class="tb" data-cmd="strikeThrough" aria-label="Strikethrough" data-icon="strike"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="h1" aria-label="Heading 1"><b>H1</b></button>
      <button class="tb" data-cmd="h2" aria-label="Heading 2"><b>H2</b></button>
      <button class="tb" data-cmd="p" aria-label="Normal text" data-icon="paragraph"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="checklist" aria-label="Checklist" data-icon="checklist"></button>
      <button class="tb" data-cmd="insertUnorderedList" aria-label="Bulleted list" data-icon="ul"></button>
      <button class="tb" data-cmd="insertOrderedList" aria-label="Numbered list" data-icon="ol"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="foreColor" aria-label="Text color" data-icon="textColor"></button>
      <button class="tb" data-cmd="hiliteColor" aria-label="Highlight" data-icon="highlight"></button>
      <button class="tb" data-cmd="align" aria-label="Alignment" data-icon="alignLeft"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="image" aria-label="Insert image" data-icon="image"></button>
      <button class="tb" data-cmd="voice" aria-label="Record voice" data-icon="mic"></button>
      <button class="tb" data-cmd="insertHorizontalRule" aria-label="Divider" data-icon="hr"></button>
      <button class="tb" data-cmd="removeFormat" aria-label="Clear formatting" data-icon="clearFormat"></button>
    </div>

    <div id="drawToolbar" class="toolbar draw-toolbar" role="toolbar" aria-label="Handwriting tools" hidden>
      <button class="tool active" data-tool="pen" aria-label="Pen" data-icon="pen"></button>
      <button class="tool" data-tool="pencil" aria-label="Pencil" data-icon="pencil"></button>
      <button class="tool" data-tool="hl" aria-label="Highlighter" data-icon="marker"></button>
      <button class="tool" data-tool="eraser" aria-label="Eraser" data-icon="eraser"></button>
      <button class="tool" data-tool="lasso" aria-label="Lasso select" data-icon="lasso"></button>
      <span class="tb-sep"></span>
      <div class="colors">
        <div id="swatches" class="swatches"></div>
        <label class="swatch custom" aria-label="Custom color"><input id="customColor" type="color" value="#1f6feb"></label>
      </div>
      <span class="tb-sep"></span>
      <label class="size-ctl" aria-label="Size">
        <span id="sizeDot" class="size-dot"></span>
        <input id="sizeRange" type="range" min="1" max="24" step="0.5" value="3">
      </label>
      <span class="tb-sep"></span>
      <button id="btnPenOnly" class="tb pill" type="button" aria-pressed="false" title="When on, fingers scroll and zoom; only the pen draws">
        <span class="ico" data-icon="hand"></span><span class="pill-label">Pen only</span>
      </button>
    </div>

    <div id="stage" class="stage">
      <div id="scroller" class="scroller">
        <div id="pageWrap" class="page-wrap">
          <div id="page" class="page">
            <input id="noteTitle" class="note-title" type="text" placeholder="Title" maxlength="200" autocomplete="off" enterkeyhint="next">
            <div id="noteBody" class="note-body" contenteditable="true" spellcheck="true" data-placeholder="Start typing, or tap the pen to write by hand"></div>
          </div>
        </div>
      </div>
      <canvas id="inkCanvas" class="ink-canvas"></canvas>
      <canvas id="liveCanvas" class="ink-canvas live"></canvas>
      <div id="selBox" class="sel-box" hidden>
        <div class="sel-actions">
          <button type="button" data-sel="duplicate">Duplicate</button>
          <button type="button" data-sel="recolor">Recolor</button>
          <button type="button" data-sel="delete" class="danger">Delete</button>
        </div>
      </div>
      <button id="fsHandle" class="fs-handle" type="button" aria-label="Show tools" data-icon="chevronDown" hidden></button>
      <div class="zoom-ctl" aria-label="Zoom">
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="zoomReset" type="button" aria-label="Fit to width">100%</button>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>

    <div id="recBar" class="rec-bar" hidden>
      <span class="rec-dot"></span><span id="recTime">0:00</span>
      <button id="recCancel" class="text-btn" type="button">Cancel</button>
      <button id="recStop" class="text-btn strong" type="button">Done</button>
    </div>
  </section>
</div>

<!-- Popover menu + dialogs -->
<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="fileImage" type="file" accept="image/*" hidden multiple>
<input id="fileImport" type="file" accept="application/json,.json" hidden>

<dialog id="dlg" class="dlg"></dialog>

<div id="printArea" class="print-area" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
